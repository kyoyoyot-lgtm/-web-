<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>残薬調整ツール</title>
<style>
  * { box-sizing: border-box; }
  :root { 
    --bg: #f8fafc; 
    --text: #1e293b;
    --primary: #0284c7; 
    --primary-light: #e0f2fe;
    --result-section: #f1f5f9;
    --accent: #ef4444;
    --warn-text: #b45309; 
    --warn-border: #f59e0b; 
  }
  
  body { 
    margin: 0; padding: 20px; 
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    background: var(--bg); 
    color: var(--text);
    height: 100vh; width: 100vw; 
    overflow: hidden;
    display: flex;
    justify-content: center;
    align-items: center;
  }

  .container {
    width: 100%;
    max-width: 1100px; /* ノートPCの横幅に合わせて少し拡大 */
    background: white;
    border-radius: 16px;
    box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.1), 0 10px 10px -5px rgba(0, 0, 0, 0.04);
    display: flex;
    flex-direction: column;
    overflow: hidden;
    position: relative;
    border: 1px solid #e2e8f0;
  }

  /* アプリタイトル */
  .app-title {
    position: absolute;
    top: 12px;
    left: 20px;
    font-size: 13px;
    font-weight: 700;
    color: #94a3b8;
    letter-spacing: 0.05em;
  }

  /* 共通の行スタイル */
  .row {
    display: flex;
    align-items: center;
    gap: 16px;
    flex-wrap: nowrap;
  }

  .item-group {
    display: flex;
    align-items: center;
    gap: 12px;
    font-size: 18px; /* 文字を大きく */
    font-weight: 700;
    white-space: nowrap;
  }

  .unit {
    color: #475569;
    font-size: 16px;
    font-weight: 600;
    white-space: nowrap;
  }

  /* 計算用演算子 */
  .operator {
    font-size: 28px; /* 大きくして見やすく */
    font-weight: 700;
    color: #cbd5e1;
    margin: 0 4px;
    user-select: none;
  }

  /* 合計値を表示する薄型ラベル */
  .total-badge {
    background: #f8fafc;
    padding: 6px 14px;
    border-radius: 8px;
    font-size: 15px; /* 大きく */
    font-weight: 700;
    color: #475569;
    border: 1px solid #e2e8f0;
    white-space: nowrap;
    display: inline-block;
    min-width: 160px;
    text-align: center;
  }

  /* ----------------------------------
      入力ゾーン（上部）
  ---------------------------------- */
  .input-zone {
    padding: 40px 30px 25px 30px;
    display: flex;
    flex-direction: column;
    gap: 20px;
  }

  .zone-tag {
    font-size: 13px;
    font-weight: 800;
    letter-spacing: 0.05em;
    margin-bottom: -5px;
  }
  
  .input-zone .zone-tag { color: var(--primary); }

  .label-input {
    color: var(--text);
    min-width: 70px;
    font-size: 18px;
  }

  input[type="number"] {
    width: 120px; /* 横幅を少し拡大 */
    height: 60px; /* 高さを出して押しやすく */
    font-size: 32px; /* 数値を大きくハッキリと */
    font-weight: 800;
    text-align: center;
    border: 2.5px solid var(--primary);
    background: #ffffff;
    border-radius: 10px;
    outline: none;
    color: var(--primary);
    box-shadow: 0 2px 4px rgba(2, 132, 199, 0.05);
    transition: all 0.2s;
  }
  input[type="number"]:focus {
    background-color: var(--primary-light);
    box-shadow: 0 0 0 4px rgba(2, 132, 199, 0.2);
  }

  /* ----------------------------------
      計算結果ゾーン（下部）
  ---------------------------------- */
  .result-zone {
    background: var(--result-section);
    padding: 25px 30px 25px 30px;
    border-top: 3px dashed #cbd5e1;
    display: flex;
    flex-direction: column;
    gap: 20px;
  }

  .result-zone .zone-tag { color: #475569; }

  .label-result {
    color: #475569;
    min-width: 70px;
    font-size: 18px;
  }
  
  .label-wide {
    min-width: 100px;
    color: var(--text);
  }

  /* 計算結果のボックス */
  .result-box {
    width: 120px;
    height: 60px;
    font-size: 32px; /* 結果の数字も大きく */
    font-weight: 800;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #ffffff; /* 白背景にして視認性アップ */
    border: 2.5px solid #cbd5e1;
    border-radius: 10px;
    color: var(--text);
  }

  /* 変更後日数のボックス */
  .result-box.highlight {
    border: 3.5px solid var(--primary);
    color: var(--primary);
    box-shadow: 0 4px 6px -1px rgba(2, 132, 199, 0.1);
  }

  .vertical-group {
    display: flex;
    flex-direction: column;
    gap: 6px;
    align-items: flex-start;
  }

  /* 下部レイアウト（内訳と予定日） */
  .bottom-flex {
    display: flex;
    justify-content: space-between;
    align-items: flex-end; /* 下揃えで高さを固定 */
    margin-top: 5px;
    gap: 20px;
    height: 110px; /* エリア全体の高さを110pxに完全固定 */
  }

  /* 左側：情報エリア全体を110pxに固定して内枠を綺麗に配置 */
  .left-info-area {
    display: flex;
    flex-direction: column;
    justify-content: flex-end; /* 下側を基準に整列 */
    gap: 8px;
    flex: 1;
    height: 100%;
    max-width: 550px;
  }

  /* 左下の使い方ガイド（高さを固定し、はみ出しを防ぐ） */
  .guide-box {
    background: #e2e8f0;
    padding: 10px 16px;
    border-radius: 8px;
    font-size: 12px;
    color: #475569;
    line-height: 1.5;
    height: 110px; /* 内訳がない時の高さを固定 */
    display: flex;
    flex-direction: column;
    justify-content: center;
  }
  .guide-box ul {
    margin: 4px 0 0 0;
    padding-left: 18px;
  }

  /* 内訳表示（ガイドの上にピタッと重ね、高さを崩さないように絶対配置を応用） */
  .breakdown-wrap {
    position: relative;
    height: 0; /* 高さをゼロにして下に影響を与えない */
  }

  .breakdown { 
    position: absolute;
    bottom: 8px; /* ガイドボックスのすぐ上に浮くように配置 */
    left: 0;
    font-size: 15px;
    font-weight: 700;
    color: #334155;
    background: #ffffff;
    padding: 8px 14px;
    border-radius: 8px;
    border-left: 5px solid var(--primary);
    box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
    white-space: nowrap;
    z-index: 10;
  }
  
  /* 右下の予定日ボックス */
  .date-box {
    background: #ffffff;
    padding: 12px 24px;
    border-radius: 10px; 
    border: 2.5px solid var(--primary);
    box-shadow: 0 4px 12px rgba(2, 132, 199, 0.08);
    display: flex;
    flex-direction: column;
    gap: 4px;
    min-width: 240px;
    height: 110px; /* 左側・右側で高さを統一 */
    justify-content: center;
  }
  
  .date-title {
    font-size: 13px;
    color: var(--primary);
    font-weight: 800;
  }
  
  .today-text {
    font-size: 12px;
    color: #64748b;
    font-weight: 600;
  }

  .end-date-val {
    font-size: 26px; /* 日付をかなり大きく */
    font-weight: 800;
    color: var(--accent);
  }
  
  /* 端数警告発生時 */
  .warn-yellow {
    background: #fffbeb !important;
    border: 3.5px solid var(--warn-border) !important;
    color: var(--warn-text) !important;
  }
</style>
</head>
<body>

<div class="container">
  <!-- 左上のタイトル -->
  <div class="app-title">残薬調整アプリ</div>

  <!-- 入力ゾーン -->
  <div class="input-zone">
    <div class="zone-tag">▼ 入力エリア</div>
    
    <!-- 1段目: 1日量 ＆ 処方日数 ＆ 元処方合計 -->
    <div class="row">
      <div class="item-group">
        <span class="label-input">1日量</span>
        <input type="number" id="dose" step="any">
        <span class="unit">錠 (包)</span>
      </div>
      
      <span class="operator">×</span>
      
      <div class="item-group">
        <input type="number" id="rx" step="1">
        <span class="unit">日分</span>
      </div>
      
      <div class="total-badge" style="margin-left: 20px;">
        元処方合計: <span id="outOriginalTotal">-</span> 錠 (包)
      </div>
    </div>

    <!-- 2段目: 残薬数 -->
    <div class="row">
      <div class="item-group">
        <span class="label-input">残薬数</span>
        <input type="number" id="rem" step="any">
        <span class="unit">錠 (包)</span>
      </div>
    </div>
  </div>

  <!-- 計算結果ゾーン -->
  <div class="result-zone">
    <div class="zone-tag">▼ 計算結果</div>
    
    <!-- 3段目: 変更後日数 ＆ 残薬日数 ＆ 端数 -->
    <div class="row" style="align-items: flex-start;">
      <!-- 変更後日数グループ -->
      <div class="vertical-group">
        <div class="item-group">
          <span class="label-result label-wide">変更後日数</span>
          <div id="outAdj" class="result-box highlight">-</div>
          <span class="unit" style="font-weight: bold; color: var(--primary);">日分</span>
        </div>
        <div class="total-badge" style="margin-left: 116px; background: #e0f2fe; border-color: #bae6fd; color: #0369a1;">
          変更後合計: <span id="outAdjTotal">-</span> 錠 (包)
        </div>
      </div>
      
      <!-- 残薬日数グループ -->
      <div class="vertical-group" style="margin-left: 20px;">
        <div class="item-group">
          <span class="label-result">残薬日数</span>
          <div id="outDays" class="result-box">-</div>
          <span class="unit">日分</span>
        </div>
        <div class="total-badge" style="margin-left: 86px;">
          残薬合計: <span id="outRemDaysTotal">-</span> 錠 (包)
        </div>
      </div>

      <span class="operator" style="margin-top: 10px; margin-left: 10px;">＋</span>

      <!-- 端数グループ -->
      <div class="item-group" style="margin-left: 10px;">
        <span class="label-result" style="min-width: auto;">端数</span>
        <div id="outFrac" class="result-box">-</div>
        <span class="unit">錠 (包)</span>
      </div>
    </div>

    <!-- 最下部（内訳＆予定日＆使い方） -->
    <div class="bottom-flex">
      <!-- 左側: 内訳（浮遊配置）と使い方ガイド（高さ固定） -->
      <div class="left-info-area">
        <div class="breakdown-wrap">
          <div id="outBD" class="breakdown" style="display:none;"></div>
        </div>
        <div class="guide-box">
          <strong>💡 使い方ガイド</strong>
          <ul>
            <li>「1日量」「日分」「残薬数」を入力すると、リアルタイムで自動計算されます。</li>
            <li><strong>Enterキー</strong>を押すと、次の入力ボックスへスムーズに移動します。</li>
            <li>残薬が沢山ある場合は何日分に相当するか、何月何日まであるか表示されます。</li>
          </ul>
        </div>
      </div>

      <!-- 右下: 予定日ボックス -->
      <div class="date-box">
        <div class="today-text">本日: <span id="todayDisp"></span></div>
        <div class="date-title">飲み終わる予定日</div>
        <div id="endDisp" class="end-date-val">-</div>
      </div>
    </div>
  </div>

</div>

<script>
  const elDose = document.getElementById('dose'), elRx = document.getElementById('rx'), elRem = document.getElementById('rem');
  const inputs = [elDose, elRx, elRem];
  const today = new Date();
  document.getElementById('todayDisp').textContent = `${today.getFullYear()}/${today.getMonth()+1}/${today.getDate()}`;

  function clearAll() {
    document.getElementById('outOriginalTotal').textContent = "-";
    document.getElementById('outDays').textContent = "-";
    document.getElementById('outRemDaysTotal').textContent = "-";
    document.getElementById('outFrac').textContent = "-";
    document.getElementById('outAdj').textContent = "-";
    document.getElementById('outAdjTotal').textContent = "-";
    document.getElementById('endDisp').textContent = "-";
    document.getElementById('outBD').style.display = 'none';
    document.getElementById('outFrac').classList.remove('warn-yellow');
  }

  function calc() {
    const d = parseFloat(elDose.value), r = parseFloat(elRx.value), m = parseFloat(elRem.value);
    
    if (isNaN(d) || d <= 0) {
      clearAll();
      return;
    }

    let origTotal = 0;
    if (!isNaN(r)) {
      origTotal = d * r;
      document.getElementById('outOriginalTotal').textContent = parseFloat(origTotal.toFixed(3));
    } else {
      document.getElementById('outOriginalTotal').textContent = "-";
    }

    if (isNaN(m) || isNaN(r)) {
      document.getElementById('outDays').textContent = "-";
      document.getElementById('outRemDaysTotal').textContent = "-";
      document.getElementById('outFrac').textContent = "-";
      document.getElementById('outAdj').textContent = "-";
      document.getElementById('outAdjTotal').textContent = "-";
      document.getElementById('endDisp').textContent = "-";
      document.getElementById('outBD').style.display = 'none';
      document.getElementById('outFrac').classList.remove('warn-yellow');
      return;
    }

    const remainDays = Math.floor(m / d + 1e-9);
    const frac = Math.max(0, m - (remainDays * d));
    const fmtFrac = Math.abs(frac) < 1e-6 ? "0" : parseFloat(frac.toFixed(3));
    
    document.getElementById('outDays').textContent = remainDays;
    document.getElementById('outFrac').textContent = fmtFrac;
    
    const remDaysTotal = d * remainDays;
    document.getElementById('outRemDaysTotal').textContent = parseFloat(remDaysTotal.toFixed(3));
    
    const hasFrac = Math.abs(frac) > 1e-6;
    document.getElementById('outFrac').classList.toggle('warn-yellow', hasFrac);

    let adj = Math.ceil(r - (m / d) - 1e-9);
    adj = adj < 0 ? 0 : adj;
    document.getElementById('outAdj').textContent = adj;

    const adjTotal = d * adj;
    document.getElementById('outAdjTotal').textContent = parseFloat(adjTotal.toFixed(3));

    const total = remainDays + adj;
    const target = new Date();
    target.setDate(today.getDate() + total);
    document.getElementById('endDisp').textContent = `${target.getFullYear()}/${target.getMonth()+1}/${target.getDate()}`;

    const bd = document.getElementById('outBD');
    if (m > origTotal) {
      bd.style.display = 'inline-block';
      const overDays = remainDays - r;
      if (hasFrac) {
        bd.innerHTML = `内訳：処方 ${r}日 ＋ 過剰 ${overDays}日 と ${fmtFrac} 錠 (包)`;
      } else {
        bd.innerHTML = `内訳：処方 ${r}日 ＋ 過剰 ${overDays}日`;
      }
    } else {
      bd.style.display = 'none';
    }
  }

  inputs.forEach((el, i) => {
    el.addEventListener('input', calc);
    el.addEventListener('focus', () => el.select());
    el.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') {
        e.preventDefault();
        inputs[(i + 1) % 3].focus();
      }
    });
  });

  elDose.focus();
</script>
</body>
</html>
